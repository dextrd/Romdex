name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build --configuration Release
      - name: Check the model matches the migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/Romdex.Core --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    env:
      ROMS_PATH: ./roms
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml build
      # The tests run in Development, which serves the web app differently; this checks the published image.
      - name: Smoke-test the image
        run: |
          mkdir -p roms dats
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
          for i in $(seq 30); do curl -fs http://localhost:8788/api/v1/health && break; sleep 2; done
          page=$(curl -fs http://localhost:8788/)
          assets=$(echo "$page" | grep -oE '(src|href)="[^"#]+\.(js|css)"' | cut -d'"' -f2)
          test -n "$assets"
          for asset in $assets; do curl -fs -o /dev/null "http://localhost:8788/$asset" || { echo "missing: $asset"; exit 1; }; done
          if echo "$page" | grep -q '#\['; then echo "unfilled asset placeholder in index.html"; exit 1; fi
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml logs
